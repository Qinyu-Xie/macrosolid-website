<!DOCTYPE html>
<html>
<head>
<style>
body { background: #faf9f7; margin: 0; font-family: 'Outfit', sans-serif; }
.trusted-by { padding: 2.5rem 0; text-align: center; }
.trusted-by-label { display: block; font-size: 0.75rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: #a8a29e; margin-bottom: 0.75rem; }
.trusted-by-logos { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 2rem 3rem; }
.trusted-by-logos img { height: 28px; width: auto; object-fit: contain; filter: grayscale(1) brightness(0.35); opacity: 0.7; transition: opacity 0.3s, filter 0.3s; }
.trusted-by-logos img:hover { opacity: 1; filter: grayscale(0); }
h3 { text-align: center; margin-top: 2rem; color: #57534e; font-size: 0.85rem; }
</style>
</head>
<body>
<section class="trusted-by">
  <span class="trusted-by-label">Trusted by</span>
  <div class="trusted-by-logos">
    <img src="images/logos/gulfstream.png" alt="Gulfstream Aerospace" />
    <img src="images/logos/turkish-airlines.png" alt="Turkish Airlines" />
    <img src="images/logos/us-coast-guard.svg" alt="US Coast Guard" />
    <img src="images/logos/gamestop.svg" alt="GameStop" />
    <img src="images/logos/eb-games.svg" alt="EB Games" />
  </div>
</section>
<h3>Hover over logos to see full color</h3>
</body>
</html>
